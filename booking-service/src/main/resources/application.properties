# Application name
spring.application.name=booking-service

# Booking microservice port
server.port=8083

# MongoDB connection
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tripsync_booking}
# the unique indexes on Booking are what stop duplicate active bookings
spring.data.mongodb.auto-index-creation=true

# Calls to other services must not hang: an ambiguous seat call is resolved, not waited on
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# Other microservices (local development)
tripsync.flight-login=http://localhost:8080
tripsync.flight-url=${FLIGHT_SERVICE_URL:http://localhost:8081}
tripsync.seat-url=${SEAT_SERVICE_URL:http://localhost:8082}
tripsync.passenger-url=${PASSENGER_SERVICE_URL:http://localhost:8084}

# Base64 HS256 key, same as auth-service. Local dev default only: set JWT_SECRET anywhere real
