# Application name
spring.application.name=booking-service

# Booking microservice port
server.port=8083

# MongoDB connection
spring.mongodb.uri=mongodb://localhost:27017/tripsync_booking

# Other microservices (local development)
tripsync.flight-login=http://localhost:8080
tripsync.flight-url=http://localhost:8081
tripsync.seat-url=http://localhost:8082
tripsync.passenger-url=http://localhost:8084

# JWT verification — replace with the actual Auth Service JWKS endpoint
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/.well-known/jwks.json