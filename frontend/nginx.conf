# Serves the built app and forwards /api/<service>/ to each backend container,
# so the browser stays on one origin (no CORS needed).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    location /api/flight/    { proxy_pass http://flight-service:8081/; }
    location /api/seat/      { proxy_pass http://seat-service:8082/; }
    location /api/booking/   { proxy_pass http://booking-service:8083/; }
    location /api/passenger/ { proxy_pass http://passenger-service:8084/; }
    location /api/auth/      { proxy_pass http://auth-service:8085/; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # client-side routes (/bookings, /book/123) all load the app
    location / {
        try_files $uri /index.html;
    }
}
